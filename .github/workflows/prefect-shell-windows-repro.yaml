name: Prefect Shell Windows Repro

on:
  workflow_dispatch:
    inputs:
      prefect_ref:
        description: "Prefect git ref to install prefect-shell from"
        required: true
        default: "fix-shelloperation-powershell-policy"
      prefect_repo:
        description: "Prefect repository to install prefect-shell from"
        required: true
        default: "rangampallysonali/prefect"

permissions:
  contents: read

jobs:
  repro:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
          python-version: "3.12"

      - name: Install prefect-shell from target ref
        shell: pwsh
        run: |
          uv venv
          uv pip install "prefect-shell @ git+https://github.com/${{ inputs.prefect_repo }}.git@${{ inputs.prefect_ref }}#subdirectory=src/integrations/prefect-shell"

      - name: Run PowerShell shell argument repro
        shell: pwsh
        run: |
          @'
          from prefect_shell import ShellOperation

          result = ShellOperation(
              commands=["Write-Output 'prefect-shell powershell args ok'"],
              extension=".ps1",
              shell="powershell.exe -executionpolicy bypass",
              stream_output=False,
          ).run()

          assert result == ["prefect-shell powershell args ok"], result
          print(result)
          '@ | Out-File -FilePath repro.py -Encoding utf8

          uv run python repro.py

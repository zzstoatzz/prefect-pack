name: Run Tests

env:
  # enable colored output - see https://github.com/pytest-dev/pytest/issues/7443
  PY_COLORS: 1

on:
  push:
    branches: ["main"]
    paths:
      - .github/workflows/tests.yml
      - src/**
      - tests/**
      - pyproject.toml

  pull_request:
    paths:
      - .github/workflows/tests.yml
      - src**
      - tests/**
      - pyproject.toml

  workflow_dispatch:

permissions:
  contents: read

jobs:
  prefect_shell_windows_repro:
    name: Prefect shell PowerShell args repro
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
          python-version: "3.12"

      - name: Install prefect-shell from fix branch
        shell: pwsh
        run: |
          uv venv
          uv pip install "prefect-shell @ git+https://github.com/PrefectHQ/prefect.git@codex/prefect-shell-powershell-args#subdirectory=src/integrations/prefect-shell"

      - name: Run PowerShell shell argument repro
        shell: pwsh
        run: |
          @'
          from prefect_shell import ShellOperation

          result = ShellOperation(
              commands=["Write-Output 'prefect-shell powershell args ok'"],
              extension=".ps1",
              shell="powershell.exe -executionpolicy bypass",
              stream_output=False,
          ).run()

          assert result == ["prefect-shell powershell args ok"], result
          print(result)
          '@ | Out-File -FilePath repro.py -Encoding utf8

          uv run python repro.py

  run_tests:
    name: Run Tests on ${{ matrix.os }} with Python ${{ matrix.python-version }}
    timeout-minutes: 15
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ['3.10', '3.11', '3.12']
        
        
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
          python-version: ${{ matrix.python-version }}
      - uses: extractions/setup-just@v2
      - name: Run test
        run: just test
        if: ${{ !github.event.pull_request.head.repo.fork }}
